
<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10121a">
  <title>StarLife</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">SIMULADOR DE VIDA</div>
        <h1>⭐ StarLife</h1>
      </div>
      <div class="year-box">
        <small>ANO</small>
        <strong id="yearLabel">—</strong>
      </div>
    </header>

    <main id="mainContent">
      <section id="startScreen" class="screen">
        <div class="hero">
          <div class="hero-icon">🌍</div>
          <h2>Começa a tua história</h2>
          <p>Cria a tua personagem e constrói uma vida à tua maneira.</p>
        </div>

        <div class="panel">
          <h3>Dados da personagem</h3>
          <label>Nome próprio
            <input id="playerFirstName" type="text" maxlength="30" placeholder="O teu nome">
          </label>
          <label>Apelido
            <input id="playerLastName" type="text" maxlength="30" placeholder="O teu apelido">
          </label>
          <label>Sexo
            <select id="playerSex">
              <option value="">Selecionar</option>
              <option value="Masculino">Masculino</option>
              <option value="Feminino">Feminino</option>
              <option value="Outro">Outro</option>
            </select>
          </label>
          <label>Idade inicial
            <input id="playerAge" type="number" min="0" max="100" value="18">
          </label>
          <label>País
            <input id="playerCountry" type="text" placeholder="Portugal">
          </label>
          <label>Cidade
            <input id="playerCity" type="text" placeholder="Lisboa">
          </label>
          <p id="startError" class="error"></p>
          <button id="startButton" class="primary" disabled>Começar vida</button>
        </div>

        <div class="panel">
          <div class="panel-heading">
            <h3>Família inicial</h3>
            <button id="addInitialFamily" class="small-button">＋ Adicionar familiar</button>
          </div>
          <p class="muted">Podes começar sem familiares e adicioná-los mais tarde.</p>
          <div id="initialFamilyList"></div>
        </div>
      </section>

      <section id="gameScreen" class="screen hidden">
        <div id="tabContent"></div>
      </section>
    </main>

    <nav id="bottomNav" class="bottom-nav hidden">
      <button data-tab="home" class="nav-item active"><span>🏠</span><small>Início</small></button>
      <button data-tab="wealth" class="nav-item"><span>💰</span><small>Património</small></button>
      <button data-tab="career" class="nav-item"><span>💼</span><small>Carreira</small></button>
      <button data-tab="business" class="nav-item"><span>🏢</span><small>Negócios</small></button>
      <button data-tab="people" class="nav-item"><span>👥</span><small>Pessoas</small></button>
      <button data-tab="shop" class="nav-item"><span>🛍️</span><small>Loja</small></button>
      <button data-tab="profile" class="nav-item"><span>👤</span><small>Perfil</small></button>
      <button data-tab="settings" class="nav-item"><span>⚙️</span><small>Definições</small></button>
    </nav>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card">
      <div class="modal-heading">
        <h3 id="modalTitle">Adicionar familiar</h3>
        <button id="closeModal" class="icon-button" aria-label="Fechar">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarLife</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .avatar-stage-circle {
      width: 140px;
      height: 140px;
      margin: 10px auto;
      border-radius: 50%;
      background: var(--bg-color, #152238);
      border: 3px solid var(--accent-color, #3b82f6);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 22px rgba(0,0,0,0.4);
    }
    .avatar-stage-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .avatar-nav-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 10px;
    }
    .avatar-arrow-btn {
      background: var(--panel-light, #2b446e);
      color: var(--text-main, #f8fafc);
      border: 1px solid var(--border-color, #334e7b);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }
    .avatar-arrow-btn:active {
      background: var(--accent-color, #3b82f6);
      color: #fff;
    }
    .avatar-index-label {
      font-weight: bold;
      color: var(--accent-color, #3b82f6);
      min-width: 50px;
      text-align: center;
    }
    #headerAvatarContainer img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <!-- Ecrã Inicial / Criação de Personagem -->
  <div id="setupScreen" class="screen">
    <div class="panel setup-panel">
      <h1>⭐ StarLife</h1>
      <p>A tua vida. As tuas escolhas.</p>
      
      <div id="startForm">
        <!-- Pré-visualização e Seleção do Avatar Completo -->
        <div class="panel" style="margin-top: 12px; background: rgba(0,0,0,0.22); text-align: center;">
          <h3>🎨 Escolher Avatar</h3>
          
          <div class="avatar-stage-circle">
            <img id="setupAvatarImg" src="assets/modules/masculino/avatars/Avatar_masculino_1.png" alt="Avatar">
          </div>
          
          <div class="avatar-nav-row">
            <button type="button" class="avatar-arrow-btn" onclick="changeSetupAvatar(-1)">◀</button>
            <span id="setupAvatarIndex" class="avatar-index-label">#1</span>
            <button type="button" class="avatar-arrow-btn" onclick="changeSetupAvatar(1)">▶</button>
          </div>
        </div>

        <div class="input-group">
          <label>Nome</label>
          <input type="text" id="playerName" placeholder="Ex: João" value="João" required>
        </div>
        <div class="input-group">
          <label>Apelido</label>
          <input type="text" id="playerSurname" placeholder="Ex: Silva" value="Silva" required>
        </div>
        <div class="input-group">
          <label>Género</label>
          <select id="playerSex" onchange="onSetupGenderChange()">
            <option value="Masculino">Masculino</option>
            <option value="Feminino">Feminino</option>
          </select>
        </div>
        <div class="input-group">
          <label>País</label>
          <input type="text" id="playerCountry" value="Portugal">
        </div>
        <div class="input-group">
          <label>Cidade</label>
          <input type="text" id="playerCity" value="Lisboa">
        </div>

        <!-- Secção para Adicionar Família Manualmente -->
        <div class="panel" style="margin-top: 15px; background: rgba(0,0,0,0.18);">
          <h3>👨‍👩‍👧 Adicionar Familiar (Opcional)</h3>
          <div class="input-group">
            <label>Nome do Familiar</label>
            <input type="text" id="famName" placeholder="Ex: Maria">
          </div>
          <div class="input-group">
            <label>Parentesco</label>
            <select id="famRelation">
              <option value="Mãe">Mãe</option>
              <option value="Pai">Pai</option>
              <option value="Irmão/ã">Irmão/ã</option>
              <option value="Avó">Avó</option>
              <option value="Avô">Avô</option>
              <option value="Outro">Outro</option>
            </select>
          </div>
          <div class="input-group">
            <label>Idade</label>
            <input type="number" id="famAge" value="30" min="0" max="120">
          </div>
          <div class="input-group">
            <label>Estado Civil</label>
            <select id="famMaritalStatus">
              <option value="Solteiro/a">Solteiro/a</option>
              <option value="Casado/a">Casado/a</option>
            </select>
          </div>
          <button type="button" id="addFamilyMemberBtn" class="secondary-btn full-width">+ Adicionar à Lista</button>
          
          <div id="setupFamilyList" style="margin-top: 10px;" class="people-list"></div>
        </div>

        <button type="button" onclick="startGame()" class="primary-btn full-width" style="margin-top: 15px;">Nova Vida</button>
      </div>

      <div id="continuePanel" class="hidden" style="margin-top: 15px;">
        <button id="continueGameBtn" class="secondary-btn full-width">Continuar Jogo</button>
        <button id="deleteSaveBtn" class="danger-btn full-width" style="margin-top: 8px;">Apagar Jogo Guardado</button>
      </div>
    </div>
  </div>

  <!-- Ecrã Principal do Jogo -->
  <div id="gameScreen" class="screen hidden">
    <header class="game-header">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div id="headerAvatarContainer" class="header-avatar"></div>
        <div class="player-info-main">
          <h2 id="homePlayerName">Nome</h2>
          <p id="homePlayerLocation">Localização</p>
        </div>
      </div>
      <div class="age-display">
        <span>Idade: <strong id="homeAge">0</strong></span>
        <button id="advanceYearBtn" class="primary-btn">+ 1 Ano</button>
      </div>
    </header>

    <main class="game-body">
      <!-- Tab: Início -->
      <section id="homeTab" class="tab-content">
        <div class="panel">
          <h3>Estatísticas</h3>
          <div class="stat-bar">
            <span>Saúde</span>
            <div class="bar"><div id="healthBar" class="fill"></div></div>
            <strong id="healthValue">100%</strong>
          </div>
          <div class="stat-bar">
            <span>Felicidade</span>
            <div class="bar"><div id="happinessBar
